name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of cancelling it mid-migration.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check configuration
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ACCESS_AUD; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (see README: Deploying from GitHub)"; exit 1; }
          done

      # Idempotent: creates the D1 database and R2 bucket on the first run, reuses them after.
      - name: Provision D1 and R2
        run: |
          d1_id() {
            local out
            out=$(npx wrangler d1 list --json) || { echo "::error::Listing D1 databases failed. Does the API token have Account → D1 → Edit?"; return 1; }
            jq -r '.[] | select(.name == "art-lab") | .uuid' <<<"$out"
          }
          id=$(d1_id)
          if [ -z "$id" ]; then npx wrangler d1 create art-lab; id=$(d1_id); fi
          [ -n "$id" ] || { echo "::error::could not find or create the art-lab D1 database"; exit 1; }
          echo "D1_DATABASE_ID=$id" >> "$GITHUB_ENV"
          npx wrangler r2 bucket info art-lab-outputs >/dev/null 2>&1 || npx wrangler r2 bucket create art-lab-outputs

      # The committed wrangler.jsonc keeps placeholders; fill them before building.
      - name: Fill in deployment ids
        run: |
          sed -i "s/REPLACE_WITH_D1_ID/$D1_DATABASE_ID/; s/REPLACE_WITH_ACCESS_AUD/$ACCESS_AUD/" wrangler.jsonc
          ! grep -n REPLACE_WITH wrangler.jsonc

      - run: npm run cf-typegen
      - run: npm run build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply art-lab --remote
      - name: Deploy worker
        run: npx wrangler deploy
